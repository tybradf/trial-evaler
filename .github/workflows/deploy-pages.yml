name: Deploy static site to GitHub Pages

# Builds the dashboard + case-explorer pages as static HTML and publishes
# them to GitHub Pages. Does NOT include /live -- that page needs a running
# server with a secret API key, which Pages structurally cannot provide.
# The static site's "Live demo" link instead points to the real deployed
# app (see deploy-render.yml / render.yaml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt jinja2

      - name: Build static site
        # LIVE_APP_URL should point at your deployed Render app (or
        # whichever host runs the full Flask app with /live). Set it as a
        # repo variable: Settings -> Secrets and variables -> Actions -> Variables.
        run: |
          python app/build_static.py --live-url "${{ vars.LIVE_APP_URL }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
